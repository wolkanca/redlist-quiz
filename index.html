    <style>
		:root {
		  --game-bg: #0b0d10;
		  --game-card: #11151a;
		  --game-card-2: #171c22;
		  --game-border: rgba(255,255,255,.09);
		  --game-border-hover: rgba(255,255,255,.22);
		  --game-text: #f5f7fa;
		  --game-muted: #9ba6b2;
		  --game-accent: #f2556b;
		  --game-success: #31c96b;
		  --game-danger: #ff4d5c;
		  --game-footer: rgba(10,12,15,.94);
		  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
		}

		html {
		  font-size: 62.5%;
		  min-width: 300px;
		  scroll-behavior: smooth;
		  color-scheme: dark;
		}

		html,
		body {
		  margin: 0;
		  padding: 0;
		  border: 0;
		  min-width: 300px;
		  overflow-x: hidden;
		  background: var(--game-bg);
		}

		body {
		  box-sizing: border-box;
		  color: var(--game-text);
		  font-family: var(--font-family);
		  font-size: 1.6rem;
		  letter-spacing: -.015em;
		}

		*,
		*:before,
		*:after {
		  box-sizing: border-box;
		}

		a {
		  color: inherit;
		}

		button {
		  appearance: none;
		  font-family: inherit;
		}

		#trr {
		  width: 100%;
		  display: block;
		  position: relative;
		  margin: 0 auto;
		  padding: 2rem 0;
		  text-align: center;
		  color: var(--game-text);
		}

		/* Ana oyun kartı */
		#trr .container {
		  position: relative;
		  width: 58rem;
		  max-width: calc(100% - 2rem);
		  min-height: auto;
		  margin: 0 auto;
		  padding: 2.4rem 2.4rem 7rem;

		  overflow: hidden;

		  background:
			radial-gradient(
			  circle at top,
			  rgba(255,255,255,.045),
			  transparent 38%
			),
			var(--game-card);

		  border: 1px solid var(--game-border);
		  border-radius: 2.2rem;

		  box-shadow:
			0 20px 60px rgba(0,0,0,.28),
			inset 0 1px rgba(255,255,255,.04);
		}

		/* Başlık */
		#trr h2 {
		  margin: .3rem 0 2rem;
		  color: var(--game-text);
		  font-size: 2.6rem !important;
		  line-height: 1.2;
		  font-weight: 750;
		  letter-spacing: -.04em;
		}

		/* Quiz alanı */
		#trr #quiz-container {
		  min-height: 0;
		  overflow: visible;
		}

		/* Fotoğraf */
		#trr .image-container {
		  position: relative;
		  width: min(32rem, 100%);
		  margin: 0 auto 1.8rem;
		}

		#trr .image-container img {
		  display: block;
		  width: 100%;
		  height: 34rem;
		  min-height: 0;
		  margin: 0 auto;

		  aspect-ratio: 3 / 4;
		  object-fit: contain;

		  background-color: #090b0e;
		  background-size: contain;
		  background-repeat: no-repeat;
		  background-position: center;

		  border: 1px solid rgba(255,255,255,.08);
		  border-radius: 1.8rem;

		  box-shadow:
			0 14px 35px rgba(0,0,0,.35);
		}

		/* Soru */
		#trr h3 {
		  margin: 1.8rem auto 1.5rem;
		  color: var(--game-text);
		  font-size: 2rem !important;
		  line-height: 1.25;
		  font-weight: 700;
		  letter-spacing: -.02em;
		}

		/* Cevaplar */
		#trr .abuttons {
		  display: grid;
		  grid-template-columns: repeat(2, minmax(0, 1fr));
		  gap: .9rem;
		  width: 100%;
		}

		#trr .answer-button {
		  width: 100%;
		  max-width: none;
		  min-height: 6.2rem;
		  height: auto;

		  margin: 0;
		  padding: 1.2rem 1rem;

		  color: var(--game-text);

		  background:
			linear-gradient(
			  180deg,
			  rgba(255,255,255,.045),
			  rgba(255,255,255,.015)
			),
			var(--game-card-2);

		  border: 1px solid var(--game-border);
		  border-radius: 1.3rem;

		  cursor: pointer;

		  font-size: 1.55rem;
		  line-height: 1.25;
		  font-weight: 650;
		  text-transform: none;
		  letter-spacing: 0;

		  box-shadow:
			inset 0 1px rgba(255,255,255,.025);

		  transition:
			transform .15s ease,
			border-color .15s ease,
			background .15s ease,
			box-shadow .15s ease;
		}

		#trr .answer-button:hover {
		  transform: translateY(-2px);

		  border-color: var(--game-border-hover);

		  background:
			linear-gradient(
			  180deg,
			  rgba(255,255,255,.075),
			  rgba(255,255,255,.025)
			),
			var(--game-card-2);

		  box-shadow:
			0 10px 24px rgba(0,0,0,.18);
		}

		#trr .answer-button:active {
		  transform: translateY(0) scale(.985);
		}

		#trr .answer-button:focus-visible {
		  outline: 3px solid rgba(242,85,107,.3);
		  outline-offset: 2px;
		}

		/* Skor */
		#trr .scoreboard {
		  display: flex;
		  flex-direction: row;
		  flex-wrap: wrap;
		  align-items: center;
		  justify-content: center;

		  width: 100%;
		  min-height: 7rem;
		  height: auto;

		  margin: 2rem auto 1.5rem;
		  padding: 1.2rem 2rem;

		  gap: 1.1rem;

		  background: rgba(255,255,255,.025);

		  border: 1px solid var(--game-border);
		  border-radius: 1.6rem;

		  box-shadow:
			inset 0 1px rgba(255,255,255,.025);
		}

		#scoreboard > span {
		  color: var(--game-muted);
		  font-size: 1.45rem;
		}

		#scoreboard > span > strong {
		  display: inline-block;
		  margin-left: .3rem;

		  font-size: 2.3rem;
		  line-height: 1;
		  font-weight: 800;
		  vertical-align: middle;
		}

		#scoreboard > span:first-child > strong,
		.d0ru > span:first-child > strong {
		  color: var(--game-success);
		}

		#scoreboard > span:not(:first-child) > strong,
		.naud0ru > span:not(:first-child) > strong {
		  color: var(--game-danger);
		}

		/* Alt kontrol alanı */
		#siviller {
		  display: flex;
		  flex-direction: row;
		  flex-wrap: wrap;
		  align-items: center;
		  justify-content: center;

		  width: 100%;
		  margin: 1.2rem auto 2.5rem;

		  gap: 1.4rem;
		}

		/* Reset butonu */
		#trr #reset-button {
		  flex: 0 0 auto;

		  margin: 0;
		  padding: 1.2rem 1.6rem;

		  color: #ff6a77;
		  background: rgba(255,77,92,.11);

		  border: 1px solid rgba(255,77,92,.24);
		  border-radius: 1rem;

		  cursor: pointer;

		  font-size: 1.15rem;
		  line-height: 1.2;
		  font-weight: 700;
		  text-transform: uppercase;
		  letter-spacing: .02em;

		  transition:
			background .15s ease,
			border-color .15s ease,
			transform .15s ease;
		}

		#trr #reset-button:hover {
		  background: rgba(255,77,92,.18);
		  border-color: rgba(255,77,92,.45);
		  transform: translateY(-1px);
		}

		#trr #reset-button:active {
		  transform: scale(.98);
		}

		/* Sivilleri Ekle yazısı */
		#siviller h4 {
		  margin: 0;
		  color: var(--game-muted);
		  font-size: 1.4rem !important;
		  line-height: 1.2;
		  font-weight: 650;
		}

		/* Toggle */
		#trr .switch {
		  position: relative;
		  display: inline-block;

		  flex: 0 0 auto;

		  width: 4.4rem;
		  height: 2.5rem;

		  margin: 0;
		}

		#trr .switch input {
		  width: 0;
		  height: 0;
		  opacity: 0;
		}

		#trr .slider {
		  position: absolute;

		  top: 0;
		  right: 0;
		  bottom: 0;
		  left: 0;

		  cursor: pointer;

		  background: #343b44;

		  border-radius: 99rem;

		  box-shadow:
			inset 0 0 0 1px rgba(255,255,255,.08);

		  transition: .2s ease;
		}

		#trr .slider:before {
		  position: absolute;

		  content: "";

		  width: 1.9rem;
		  height: 1.9rem;

		  left: .3rem;
		  bottom: .3rem;

		  background: #fff;

		  border-radius: 50%;

		  box-shadow:
			0 2px 7px rgba(0,0,0,.3);

		  transition: .2s ease;
		}

		#trr input:checked + .slider {
		  background: var(--game-accent);
		}

		#trr input:checked + .slider:before {
		  transform: translateX(1.9rem);
		}

		#trr input:focus-visible + .slider {
		  outline: 3px solid rgba(242,85,107,.3);
		  outline-offset: 2px;
		}

		/* Kurt butonu */
		#trr .michaelsikkofield {
		  position: absolute;

		  top: 1.3rem;
		  right: 1.3rem;

		  z-index: 10;

		  display: flex;
		  align-items: center;
		  justify-content: center;

		  width: 4.2rem;
		  height: 4.2rem;

		  padding: 0;

		  color: var(--game-muted);
		  background: rgba(255,255,255,.035);

		  border: 1px solid var(--game-border);
		  border-radius: 1.2rem;

		  text-decoration: none;

		  font-size: 2rem;
		  line-height: 1;

		  backdrop-filter: blur(12px);

		  transition:
			background .15s ease,
			color .15s ease,
			transform .15s ease;
		}

		#trr .michaelsikkofield:hover {
		  color: white;
		  background: rgba(255,255,255,.08);
		  transform: scale(1.04);
		}

		#trr .michaelsikkofield:hover:after {
		  position: absolute;

		  top: 5rem;
		  right: 0;

		  width: 15rem;

		  padding: .7rem 1rem;

		  content: "Acil durumlar harici kullanma! 🚨";

		  color: var(--game-muted);
		  background: #11151a;

		  border: 1px solid var(--game-border);
		  border-radius: .8rem;

		  font-size: 1.1rem;
		  line-height: 1.35;
		  font-weight: normal;

		  box-shadow:
			0 8px 25px rgba(0,0,0,.28);
		}

		/* Fotoğraf linki */
		#oyunlink {
		  display: block;
		  color: transparent;
		  text-decoration: none;
		}

		/* Footer */
		#trr .about {
		  position: absolute;

		  right: 0;
		  bottom: 0;

		  z-index: 20;

		  width: 50%;
		  min-height: 5rem;

		  padding: 1.5rem 2rem;

		  color: var(--game-muted);
		  background: var(--game-footer);

		  border-top: 1px solid var(--game-border);

		  font-size: 1.2rem;
		  text-align: right;

		  backdrop-filter: blur(12px);
		}

		#trr .about summary {
		  cursor: pointer;
		  color: var(--game-text);
		}

		#trr .about summary:first-of-type {
		  list-style-type: "❓";
		}

		#trr .about p {
		  margin: 1rem 0 0;
		  padding: 1rem;

		  color: var(--game-muted);
		  background: #11151a;

		  border: 1px solid var(--game-border);
		  border-radius: 1rem;

		  font-size: 1.2rem;
		  line-height: 1.5;
		}

		#trr .about a {
		  color: var(--game-text);
		}

		#trr a.opyls {
		  position: absolute;

		  left: 0;
		  bottom: 0;

		  z-index: 19;

		  display: flex;
		  align-items: center;

		  width: 50%;
		  min-height: 5rem;

		  padding: 1.5rem 2rem;

		  color: var(--game-muted);
		  background: var(--game-footer);

		  border-top: 1px solid var(--game-border);

		  text-decoration: none;

		  font-size: 1.2rem;

		  backdrop-filter: blur(12px);

		  transition: color .15s ease;
		}

		#trr a.opyls:hover {
		  color: white;
		}

		/* SweetAlert */
		html.swal2-shown,
		html.swal2-shown > body {
		  background: var(--game-bg);
		  color: var(--game-text);
		}

		html .swal2-container .swal2-popup,
		html .swal2-success-circular-line-left,
		html .swal2-success-circular-line-right,
		html .swal2-success-fix {
		  color: var(--game-text);
		  background: var(--game-card);
		}

		html .swal2-container .swal2-popup {
		  border: 1px solid var(--game-border);
		  border-radius: 2rem;

		  box-shadow:
			0 25px 80px rgba(0,0,0,.45);
		}

		html .swal2-container .swal2-title,
		html .swal2-container .swal2-html-container {
		  color: var(--game-text);
		}

		div:where(.swal2-container) .swal2-html-container > small {
		  display: block;
		  width: 100%;
		}

		.swal2-show {
		  transform: scale(1);
		}

		/* Tablet */
		@media (max-width: 700px) {

		  #trr .container {
			width: 54rem;
		  }

		  #trr .image-container {
			width: min(30rem, 85%);
		  }
		}

		/* Mobil */
		@media (max-width: 520px) {

		  html,
		  body {
			width: 100%;
		  }

		  #trr {
			min-height: 100svh;
			padding: 0;
		  }

		  #trr .container {
			width: 100%;
			max-width: 100%;
			min-height: 100svh;

			margin: 0;
			padding:
			  max(1.2rem, env(safe-area-inset-top))
			  1.4rem
			  calc(6.2rem + env(safe-area-inset-bottom));

			border-left: 0;
			border-right: 0;
			border-top: 0;
			border-radius: 0;

			box-shadow: none;
		  }

		  #trr h2 {
			margin: .7rem 0 1.4rem;

			font-size: 2rem !important;
			line-height: 1.2;
		  }

		  /* Kurt butonu */
		  #trr .michaelsikkofield {
			top: max(.9rem, env(safe-area-inset-top));
			right: 1rem;

			width: 3.8rem;
			height: 3.8rem;

			border-radius: 1rem;

			font-size: 1.8rem;
		  }

		  /* Fotoğraf */
		  #trr .image-container {
			width: min(25rem, 72vw);
			margin-bottom: 1.2rem;
		  }

		  #trr .image-container img {
			width: 100%;
			height: auto;
			max-height: 32rem;

			aspect-ratio: 3 / 4;

			border-radius: 1.4rem;
		  }

		  /* Soru */
		  #trr h3 {
			margin: 1.3rem auto 1.1rem;

			font-size: 1.8rem !important;
		  }

		  /* Cevaplar */
		  #trr .abuttons {
			gap: .7rem;
		  }

		  #trr .answer-button {
			min-height: 5.2rem;

			padding: .9rem .7rem;

			border-radius: 1.1rem;

			font-size: 1.25rem;
			line-height: 1.2;
		  }

		  /* Skor */
		  #trr .scoreboard {
			min-height: 5.8rem;

			margin: 1.2rem auto;
			padding: .9rem 1rem;

			border-radius: 1.3rem;

			gap: .6rem;
		  }

		  #scoreboard > span {
			font-size: 1.25rem;
		  }

		  #scoreboard > span > strong {
			font-size: 1.9rem;
		  }

		  /* Alt kontrol paneli */
		  #siviller {
			flex-wrap: nowrap;
			justify-content: space-between;

			width: 100%;

			margin: 1rem auto 1.5rem;
			padding: .8rem;

			gap: .8rem;

			background: rgba(255,255,255,.025);

			border: 1px solid var(--game-border);

		  #trr #reset-button {
			flex: 0 0 auto;

			padding: .9rem 1.1rem;

			font-size: .95rem;

			white-space: nowrap;

		  #siviller h4 {
			margin-left: auto;

			font-size: 1.15rem !important;

			white-space: nowrap;
		  }

		  #trr .switch {
			flex: 0 0 auto;

			width: 4rem;
			height: 2.3rem;
		  }

		  #trr .slider:before {
			width: 1.7rem;
			height: 1.7rem;

			left: .3rem;
			bottom: .3rem;
		  }

		  #trr input:checked + .slider:before {
			transform: translateX(1.7rem);
		  }

		  /* Footer */
		  #trr .about,
		  #trr a.opyls {
			min-height: 4.8rem;

			padding:
			  1.4rem

		  }

		  #trr .about {
			display: flex;

		  #trr a.opyls {

		  #trr .about[open] {
			width: 100%;

		  #trr .about[open] summary {
			margin-left: auto;

		  }

		  #trr .about[open] p {
			width: 100%;
			margin-top: 1rem;

		/* Çok dar ekran */
		@media (max-width: 360px) {

		  #trr .container {
			padding-left: 1rem;

		  }

		  #trr .answer-button {
			min-height: 5rem;
			font-size: 1.15rem;
		  }

		  #trr #reset-button {
			padding: .8rem;
			font-size: .9rem;
		  }

		  #siviller h4 {
			font-size: 1.05rem !important;
		  }

  <body>
    <figure id="trr">
      <div class="container">
        <h2 class="has-small-font-size">Terrorist Quiz</h2>
        <div id="quiz-container"></div>
        <div id="scoreboard" class="scoreboard">
          <span>Doğru: <strong>0</strong>
          </span> | <span>Yanlış: <strong>0</strong>
          </span>
        </div>
        <div id="siviller">
          <button id="reset-button">Skoru Sıfırla</button>
          <h4 class="has-small-font-size">Sivilleri Ekle</h4>
          <label class="switch">
            <input id="include-civilians-toggle" class="Civilians" onchange="toggleIncludeCivilians()" type="checkbox" aria-label="Sivilleri Ekle">
            <span class="round slider"></span>
          </label>
        </div>
        <details class="about">
          <summary>Hakkında</summary>
          <p>Veriler herkese açık olarak yayınlanan <a href="https://web.archive.org/web/20240000000000*/https://www.terorarananlar.pol.tr/tarananlar/" rel="noopener" target="_blank">T.C. İçişleri Bakanlığı Terör Arananlar</a> listesinden alınmaktadır. Sivillerin fotoğrafları yapay zeka ile insan fotoğrafı üreten <a href="https://wolkanca.com/olmayan-bir-kisi-fotografi-olusturmak/">thispersondoesnotexist.com</a> adresinden alınmaktadır.</p>
        </details>
        <a class="opyls" href="https://wolkanca.com/terorist-tanima-terorist-testi-oyunu-terorist-quiz#paylas">Paylaş</a>
      </div>
    </figure>
    <script>
      "use strict";
      document.getElementById('reset-button').addEventListener('click', function() {
        correctScore = 0;
        incorrectScore = 0;
        totalQuestionsAnswered = 0;
        updateScoreboard();
      });
      let correctScore = localStorage.getItem('correctScore') ? parseInt(localStorage.getItem('correctScore')) : 0,
        incorrectScore = localStorage.getItem('incorrectScore') ? parseInt(localStorage.getItem('incorrectScore')) : 0,
        totalQuestionsAnswered = correctScore + incorrectScore,
        inpt = document.getElementById("include-civilians-toggle"),
        includeCivilians, siviller_ekleme = function(e) {
          if (e) {
            inpt.classList.add('Civilians');
            localStorage.setItem("Civilians", "1");
            includeCivilians = true;
            inpt.setAttribute("checked", "");
          } else {
            inpt.classList.remove('Civilians');
            localStorage.setItem("Civilians", "0");
            includeCivilians = false;
            inpt.removeAttribute("checked");
          }
        };
      if (localStorage.getItem("Civilians") === null) {
        siviller_ekleme(false);
      } else if (localStorage.getItem("Civilians") === "1") {
        siviller_ekleme(true);
      } else if (localStorage.getItem("Civilians") === "0") {
        siviller_ekleme();
      }
      function toggleIncludeCivilians() {
        inpt.classList.toggle('Civilians');
        let val = inpt.classList.contains("Civilians") ? "1" : "0";
        inpt.toggleAttribute("checked");
        localStorage.setItem("Civilians", val);
        includeCivilians = !includeCivilians;
      }
      window.onstorage = () => {
        if (localStorage.getItem("Civilians") === "1") {
          siviller_ekleme(true);
        } else {
          siviller_ekleme();
        }
      };
      async function fetchTerroristData() {
        try {
          const response = await fetch('https://raw.githubusercontent.com/wolkanca/redlist-quiz/main/data.json');
          if (!response.ok) {
            response = await fetch('https://wolkanca.com/wp-content/uploads/2024/03/trr-data.json');
          }
          const data = await response.json();
          return data.filter((terrorist) => !!terrorist.GorselURL?.length).map(terrorist => {
            terrorist.IlkGorselURL = "https://www.terorarananlar.pol.tr" + terrorist.IlkGorselURL;
            return terrorist;
          });
        } catch (error) {
          console.error('Error fetching data:', error);
          return [];
        }
      }
      async function fetchCivilianData() {
        try {
          const civilianData = [];
          for (let i = 0; i < 750; i++) {
            const timestamp = new Date().getTime();
            const civilianImageUrl = 'https://thispersondoesnotexist.com/random-person.jpeg?timestamp=' + timestamp;
            civilianData.push({
              TOrgutAdi: 'Sivil',
              IlkGorselURL: civilianImageUrl
            });
          }
          return civilianData;
        } catch (error) {
          console.error('Hata: Sivil verileri alınamadı:', error);
          return [];
        }
      }
      async function populateQuizData() {
        let terroristData = await fetchTerroristData();
        let civilianData = [];
        if (includeCivilians) {
          civilianData = await fetchCivilianData();
        }
        const combinedData = includeCivilians ? [...terroristData, ...civilianData] : terroristData;
        combinedData.sort(() => Math.random() - 0.5);
        return combinedData;
      }
      async function displayQuiz() {
        const t = await populateQuizData();
        if (0 === t.length) return void alert("Hata: Veriler yüklenemedi. Lütfen sayfayı yenileyin.");
        const n = t[Math.floor(Math.random() * t.length)],
          e = n.TOrgutAdi,
          i = Array.from(new Set(t.map((t => t.TOrgutAdi)))),
          r = i.indexOf(e); - 1 !== r && i.splice(r, 1);
        const a = [];
        for (let t = 0; t < 3; t++) {
          const t = Math.floor(Math.random() * i.length);
          a.push(i[t]), i.splice(t, 1)
        }
        const o = [e, ...a].sort((() => Math.random() - .5)),
          s = document.getElementById("quiz-container");
        let l = n.IlkGorselURL,
          c = l.replace(/(https?:\/\/)(www\..*?)(:*)/g, "$1i1.wp.com/$3"),
          h = l.split("/").pop().split(".")[0];
        l.substring(0, l.length - 1);
        s.innerHTML = `<a class="michaelsikkofield" onclick="checkAnswer('${e}','${e}')" href="javascript://" title="michaelsikkofield fix">🐺</a>
				<div class="image-container">
					<a id="oyunlink" title="Fotoğraf bozuk ise üsteki 🐺 butonuna tıkla" href="https://wolkanca.com/terorist-tanima-terorist-testi-oyunu-terorist-quiz">
						<img decoding="async" src="${c}" height="300" width="580" id="trrimg" style="--background: url('${l}')" onerror="this.onerror=null;this.classList.add('error');this.src='${c}?'" alt="${h}"/>
					</a>
				</div>
				<h3 class="has-small-font-size">Hangi örgüt?</h3>
				<div class="abuttons">${o.map((t=>`
					<button class="answer-button" onclick="checkAnswer('${e}','${t}')" id="${t}">${t}</button>`)).join("")}
				</div>`;
      }
      async function checkQuestionCount() {
        totalQuestionsAnswered++;
        if (totalQuestionsAnswered % 20 === 0) {
          const successRate = ((correctScore / totalQuestionsAnswered) * 100).toFixed(0);
          let title = '';
          if (successRate >= 80) {
            title = 'MİT göreve çağırıyor!';
          } else if (successRate >= 60) {
            title = 'Yürü be babuş!';
          } else if (successRate >= 40) {
            title = 'Ha gayret.';
          } else {
            title = 'Hocam göz var izan var ya.';
          }
          Swal.fire({
            title: title,
            html: `<em>%${successRate}</em> oranla doğru bildin. Devam mı baştan mı?`,
            showCancelButton: true,
            confirmButtonText: 'Devam',
            cancelButtonText: 'Baştan',
            icon: 'info'
          }).then((result) => {
            if (result.isConfirmed) {
              displayQuiz();
            } else {
              correctScore = 0;
              incorrectScore = 0;
              totalQuestionsAnswered = 0;
              updateScoreboard();
              displayQuiz();
            }
          });
        } else {
          displayQuiz();
        }
      }
      function checkAnswer(correctAnswer, selectedAnswer) {
        if (selectedAnswer === correctAnswer) {
          Swal.fire({
            icon: 'success',
            html: `<span style="position:absolute;top:0;left:0;width:100%;margin:1rem auto;font-size:.8rem"><strong>${correctAnswer}</strong></span> Bravo! <small class="d0ru"><span>Doğru: <strong>${correctScore+1}</strong></span> | <span>Yanlış: <strong>${incorrectScore}</strong></span></small>`,
            confirmButtonText: 'Devam',
          }).then((result) => {
            correctScore++;
            updateScoreboard();
            checkQuestionCount();
          });
        } else {
          Swal.fire({
            icon: 'error',
            html: `<span style="position:absolute;top:0;left:0;width:100%;margin:1rem auto;font-size:.8rem"><strong>${correctAnswer}</strong></span> Maalesef. <strong>${correctAnswer}</strong> olacaktı. <small class="naud0ru"><span>Doğru: <strong>${correctScore}</strong></span> | <span>Yanlış: <strong>${incorrectScore+1}</strong></small>`,
            confirmButtonText: 'Devam',
          }).then((result) => {
            incorrectScore++;
            updateScoreboard();
            checkQuestionCount();
          });
        }
      }
      function updateScoreboard() {
        const scoreboard = document.getElementById('scoreboard');
        scoreboard.innerHTML = `<span>Doğru: <strong>${correctScore}</strong></span> | <span>Yanlış: <strong>${incorrectScore}</strong></span>`;
        localStorage.setItem('correctScore', correctScore);
        localStorage.setItem('incorrectScore', incorrectScore);
      }
      window.onload = function() {
        updateScoreboard();
        displayQuiz();
      };

      /* canonical */
      let ref = document.referrer, canonical = document.querySelector("link[rel='canonical']").getAttribute("href");
        if (!ref || !ref.match(/wolkanca/)) {
        window.location.href = canonical;
      }
      /* canonical */
    </script>
  </body>
</html>
